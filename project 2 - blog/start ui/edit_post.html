<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Post - My Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-journal-richtext"></i> My Blog
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="add_post.html"><i class="bi bi-plus-circle"></i> New Post</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <span class="nav-link text-white-50">
                        <i class="bi bi-person-circle"></i> Admin
                        <span class="badge bg-warning text-dark">admin</span>
                    </span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="login.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="h3 mb-4"><i class="bi bi-pencil-square"></i> Edit Post</h1>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form action="edit_post.html" method="post" enctype="multipart/form-data" novalidate onsubmit="return false;">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" name="title" id="title" class="form-control"
                                   value="Welcome to the Blog" maxlength="200" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Content</label>
                            <textarea name="content" id="content" class="form-control" rows="10" required>This is the very first post on our new blog.

We will be sharing news, tutorials and updates here on a regular basis. Thanks for reading, and stay tuned for more!</textarea>
                        </div>
                        <div class="mb-4">
                            <label for="image" class="form-label">Replace image (optional)</label>
                            <div class="mb-2">
                                <img src="https://dummyimage.com/450x300/495057/ffffff.png&text=Welcome" alt="Current image"
                                     class="img-thumbnail" style="max-height: 150px;">
                                <div class="form-text">Leave empty to keep the current image.</div>
                            </div>
                            <input type="file" name="image" id="image" class="form-control" accept="image/jpeg,image/png,image/gif,image/webp">
                            <div class="form-text">JPG, PNG, GIF or WEBP. Maximum 2 MB.</div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save Changes</button>
                            <a href="post.html" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-white py-4 mt-5">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
        <p class="mb-0">&copy; 2026 My Blog. All rights reserved.</p>
        <p class="mb-0 text-white-50">Built with PHP + procedural mysqli</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
